services:
  - type: web
    name: invoxa-api
    runtime: docker
    rootDir: backend
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
        required: false
      - key: GEMINI_API_KEY
        sync: false
        required: false
      - key: DATABASE_URL
        sync: false
        required: false
      - key: DEBUG
        value: "false"
