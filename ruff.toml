target-version = "py312"
line-length = 120

[lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # Pyflakes
  "I",   # isort
  "B",   # bugbear
  "SIM", # simplify
  "S",   # bandit (security)
  "RUF", # ruff-specific
  "UP",  # pyupgrade
]


[lint.per-file-ignores]
# Tests use assert and broad exception handling is acceptable here.
"backend/tests/**" = ["S101", "BLE001", "S110"]
# Extraction pipeline intentionally falls through on exceptions
# when trying multiple text-extraction strategies (pdfplumber → pymupdf → OCR).
"backend/app/extraction/ocr.py" = ["BLE001", "S110"]
# Supabase client teardown intentionally swallows errors to avoid
# crashing during lifespan shutdown.
"backend/app/supabase.py" = ["BLE001", "S110"]
# Date parsing from invoice strings is inherently naive (no timezone).
"backend/app/digest/generator.py" = ["DTZ007"]
"backend/app/validation/anomaly.py" = ["DTZ007"]
"backend/app/export/csv_export.py" = ["DTZ007"]
# GSTIN validation falls back to False on library errors.
"backend/app/validation/gstin.py" = ["BLE001", "S110"]
# FastAPI dependency injection requires File(...) in signature.
# B904: HTTPException raised from catch blocks use 'from' to preserve traceback.
"backend/app/api/invoices.py" = ["B008", "B904"]
"backend/app/api/review.py" = ["B904"]
# ExtractionResult model fields intentionally omitted for brevity.
"backend/app/extraction/gemini_fallback.py" = ["BLE001"]
